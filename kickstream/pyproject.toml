[project]
name = "kickstream"
version = "0.1.0"
description = "Lead generation and outreach for Kick streamers"
readme = "README.md"
license = {text = "AGPL-3.0"}
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "starlette>=0.37",
    "jinja2>=3.1",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "playwright>=1.44",
    "tenacity>=8.4",
    "pytz>=2024.1",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]
codex = [
    "codex-cli>=0.159",
]

[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["kickstream*"]

[tool.ruff]
line-length = 100
target-version = "py311"
lint.select = ["E", "F", "I", "UP", "B", "C4", "PTH", "T20", "ARG", "SIM", "TID"]
lint.ignore = ["SIM102", "T201", "PTH118", "PTH123"]
format.quote-style = "single"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_equality = true

[project.scripts]
kickstream = "kickstream.cli:main"